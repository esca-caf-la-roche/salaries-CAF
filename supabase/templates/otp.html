<!doctype html>
<html lang="fr">
  <body style="margin:0;background:#f6f5ef;color:#143f37;font-family:Arial,sans-serif">
    <div style="max-width:520px;margin:0 auto;padding:40px 24px">
      <p style="font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase">La Cordée · CAF La Roche Bonneville</p>
      <h1 style="font-size:28px;margin:28px 0 12px">Votre code de connexion</h1>
      <p>Saisissez ce code à 6 chiffres dans l’application&nbsp;:</p>
      <p style="margin:28px 0;padding:20px;background:#fff;border:1px solid #d9ded9;border-radius:10px;font-family:monospace;font-size:34px;font-weight:700;letter-spacing:.3em;text-align:center">{{ .Token }}</p>
      <p style="font-size:13px;color:#68736f">Ce message ne contient volontairement aucun lien de connexion. Si vous n’avez pas demandé ce code, ignorez cet e-mail.</p>
    </div>
  </body>
